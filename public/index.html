<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <title>DigiSou9 - ديجي سوق</title>
    <style>
        body { background-color: #0f172a; color: #ffffff; font-family: system-ui, sans-serif; text-align: center; padding: 40px 20px; }
        
        .logo { width: 140px; height: 140px; border-radius: 50%; margin-bottom: 15px; border: 3px solid #38bdf8; object-fit: cover; }
        
        h1 { color: #38bdf8; font-size: 2.5rem; margin-bottom: 10px; }
        p.sub { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }
        .grid { display: flex; justify-content: center; gap: 20px; flex-wrap: wrap; max-width: 1000px; margin: 0 auto; }
        .card { background-color: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 25px; width: 260px; text-align: center; transition: border-color 0.2s; }
        .card:hover { border-color: #38bdf8; }
        .prod-icon { width: 75px; height: 75px; margin-bottom: 15px; object-fit: contain; }
        .card h3 { color: #f8fafc; margin-bottom: 10px; font-size: 1.25rem; }
        .card p { color: #94a3b8; font-size: 0.9rem; min-height: 40px; }
        .price { color: #4ade80; font-size: 1.5rem; font-weight: bold; margin: 15px 0; }
        .btn-wa { background-color: #25d366; color: white; border: none; padding: 12px; border-radius: 8px; font-weight: bold; cursor: pointer; width: 100%; transition: background 0.2s; }
        .btn-wa:hover { background-color: #1eb954; }

        .footer-social { margin-top: 50px; padding-top: 20px; border-top: 1px solid #334155; }
        .fb-link { color: #3b82f6; text-decoration: none; font-size: 1.2rem; display: inline-flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; }
        .fb-link img { width: 28px; height: 28px; }
    </style>
</head>
<body>

    <img src="https://i.imgur.com/6tjYkBF.png" alt="DigiSou9 Logo" class="logo">
    
    <h1>DigiSou9 🛒</h1>
    <p class="sub">متجرك الأول للمنتجات والخدمات الرقمية</p>

    <div class="grid">
        <div class="card">
            <img src="https://img.icons8.com/clouds/100/paint-palette.png" alt="التصميم" class="prod-icon">
            <h3>حزمة أدوات التصميم</h3>
            <p>ملفات جاهزة وقوالب تصاميم احترافية لعملك.</p>
            <div class="price">49 DH</div>
            <button class="btn-wa" onclick="orderWhatsApp('حزمة أدوات التصميم')">طلب عبر WhatsApp 💬</button>
        </div>

        <div class="card">
            <img src="https://img.icons8.com/color/144/duolingo-logo.png" alt="Duolingo" class="prod-icon">
            <h3>حساب Duolingo</h3>
            <p>اشتراك تعلم اللغات مع كامل المميزات المدفوعة.</p>
            <div class="price">49 DH</div>
            <button class="btn-wa" onclick="orderWhatsApp('حساب Duolingo')">طلب عبر WhatsApp 💬</button>
        </div>

        <div class="card">
            <img src="https://img.icons8.com/fluency/96/laptop-settings.png" alt="البرامج" class="prod-icon">
            <h3>حزمة البرامج والتطبيقات</h3>
            <p>تطبيقات مونتاج وتعديل صور مثل Filmora HD وغيرها.</p>
            <div class="price">49 DH</div>
            <button class="btn-wa" onclick="orderWhatsApp('حزمة البرامج والتطبيقات')">طلب عبر WhatsApp 💬</button>
        </div>
    </div>

    <div class="footer-social">
        <a href="https://www.facebook.com/share/18gqxseuqW/" target="_blank" class="fb-link">
            <img src="https://img.icons8.com/color/48/facebook-new.png" alt="Facebook">
            تابعنا على فيسبوك
        </a>
    </div>

    <script>
        function orderWhatsApp(productName) {
            const phone = "212718049282"; 
            const message = encodeURIComponent(`السلام عليكم، أريد طلب: ${productName} من متجر DigiSou9 بسعر 49 DH`);
            window.open(`https://wa.me/${phone}?text=${message}`, '_blank');
        }
    </script>

</body>
</html>
