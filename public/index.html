<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DigiSou9 - متجر المنتجات الرقمية</title>
    <!-- إضافة خط Google Fonts للعربية -->
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { font-family: 'Cairo', sans-serif; background-color: #f4f7f6; color: #333; }
        
        /* Header */
        header { background: #2c3e50; color: white; padding: 20px; text-align: center; }
        
        /* Products Section */
        .products-section { padding: 40px 20px; }
        .container { max-width: 1000px; margin: 0 auto; }
        .products-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); 
            gap: 20px; 
            margin-top: 20px;
        }

        /* Product Card Styles */
        .product-card { 
            background: white; 
            padding: 20px; 
            border-radius: 15px; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            display: flex; flex-direction: column; justify-content: space-between;
        }
        .product-title { font-size: 1.3rem; margin-bottom: 10px; color: #2c3e50; }
        .product-desc { font-size: 0.9rem; color: #7f8c8d; margin-bottom: 20px; }
        .product-footer { display: flex; justify-content: space-between; align-items: center; }
        .product-price { font-weight: bold; color: #27ae60; font-size: 1.2rem; }
        .buy-btn { 
            background-color: #25d366; color: white; border: none; 
            padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold;
        }
        .buy-btn:hover { background-color: #128c7e; }
    </style>
</head>
<body>

    <header>
        <h1>مرحباً بك في DigiSou9</h1>
    </header>

    <section class="products-section">
        <div class="container">
            <div class="products-grid" id="productsGrid">
                <!-- هنا غادي يظهر كود الجافاسكريبت المنتجات -->
            </div>
        </div>
    </section>

    <!-- ربط ملف الجافاسكريبت -->
    <script src="script.js"></script>
</body>
</html>
